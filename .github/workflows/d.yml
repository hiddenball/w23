on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"
permissions:
  contents: write
concurrency:
  group: daily-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - timeout-minutes: 340
        run: |
          git config user.name "mlb-data-bot"
          git config user.email "actions@users.noreply.github.com"
          commit_and_push() {
            git add data
            if git diff --cached --quiet; then return 0; fi
            git commit -q -m "$(date -u +%s)$RANDOM$RANDOM"
            for i in 1 2 3 4 5; do
              if git pull -q --rebase origin "$BRANCH" && git push -q origin "$BRANCH"; then return 0; fi
              sleep $((RANDOM % 15 + 5))
            done
            return 1
          }
          through=$(date -u -d "yesterday" +%F)
          if [ -f data/last_updated.txt ]; then
            last=$(cat data/last_updated.txt)
          else
            last=$(date -u -d "2026-01-01 - 1 day" +%F)
          fi
          failed=0
          if [ "$(date -u -d "$last" +%s)" -ge "$(date -u -d "$through" +%s)" ]; then
            :
          else
            cursor=$(date -u -d "$last + 1 day" +%F)
            n=0
            while [ "$(date -u -d "$cursor" +%s)" -le "$(date -u -d "$through" +%s)" ]; do
              if [ "$cursor" = "$through" ]; then
                python3 mlb_historical_fetch.py --date "$cursor" --output-dir data && ok=1 || ok=0
              else
                python3 mlb_historical_fetch.py --date "$cursor" --games-only --output-dir data && ok=1 || ok=0
              fi
              if [ "$ok" -ne 1 ]; then
                failed=1
                break
              fi
              echo "$cursor" > data/last_updated.txt
              cursor=$(date -u -d "$cursor + 1 day" +%F)
              n=$((n + 1))
              if [ $((n % 7)) -eq 0 ]; then commit_and_push || exit 1; fi
            done
          fi
          year=$(date -u -d "$through" +%Y)
          python3 rebuild_monthly_tx.py --year "$year" --root . || true
          commit_and_push || exit 1
          curl -s "https://purge.jsdelivr.net/gh/hiddenball/w23@main/data/last_updated.txt" > /dev/null
          for m in 01 02 03 04 05 06 07 08 09 10 11 12; do
            curl -s "https://purge.jsdelivr.net/gh/hiddenball/w23@main/data/seasons/$year/transactions/$m.json" > /dev/null
          done
          curl -s "https://purge.jsdelivr.net/gh/hiddenball/w23@main/data/seasons/$year/transactions.json" > /dev/null
          curl -s "https://purge.jsdelivr.net/gh/hiddenball/w23@main/data/seasons/$year/standings-splits.json" > /dev/null
          exit $failed
